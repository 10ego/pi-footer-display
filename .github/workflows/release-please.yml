name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing non-draft GitHub release tag to recover (for example v1.2.3)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or GitHub release
    if: ${{ vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && (github.event_name == 'push' || inputs.tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create nerv-ops installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NERV_OPS_APP_ID }}
          private-key: ${{ secrets.NERV_OPS_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable squash auto-merge for release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].number' <<< "$RELEASE_PRS" | while read -r number; do
            merge_method="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // "NONE"')"
            echo "Release PR #$number auto-merge method: $merge_method"

            case "$merge_method" in
              SQUASH)
                echo "Squash auto-merge is already enabled for release PR #$number"
                continue
                ;;
              MERGE|REBASE)
                echo "Replacing $merge_method auto-merge for release PR #$number"
                gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto
                ;;
              NONE)
                ;;
              *)
                echo "Unexpected auto-merge method for release PR #$number: $merge_method" >&2
                exit 1
                ;;
            esac

            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
          done

  publish:
    name: Verify and publish to npm
    needs: release
    if: ${{ always() && vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && ((needs.release.result == 'success' && needs.release.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create nerv-ops installation token for recovery verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        id: recovery-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NERV_OPS_APP_ID }}
          private-key: ${{ secrets.NERV_OPS_PRIVATE_KEY }}

      - name: Resolve release target
        id: target
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -n "$DISPATCH_TAG" ]]; then
            TARGET_TAG="$DISPATCH_TAG"
            RECOVERY=true
            if [[ ! "$TARGET_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Recovery tag must be an exact v-prefixed semantic version: $TARGET_TAG" >&2
              exit 1
            fi
            VERSION="${TARGET_TAG#v}"
          else
            TARGET_TAG="$RELEASE_TAG"
            VERSION="$RELEASE_VERSION"
            RECOVERY=false
            if [[ -z "$TARGET_TAG" || -z "$VERSION" ]]; then
              echo "Release Please did not emit a tag and version" >&2
              exit 1
            fi
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "recovery=$RECOVERY" >> "$GITHUB_OUTPUT"

      - name: Verify recovery GitHub release
        if: ${{ steps.target.outputs.recovery == 'true' }}
        env:
          GH_TOKEN: ${{ steps.recovery-app-token.outputs.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          release="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
          [[ "$(jq -r '.tagName' <<< "$release")" == "$TARGET_TAG" ]]
          [[ "$(jq -r '.isDraft' <<< "$release")" == "false" ]] || {
            echo "Recovery release $TARGET_TAG is a draft" >&2
            exit 1
          }

      - name: Check out exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release version metadata
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: npm run verify:release-version -- --expected "$EXPECTED_VERSION"

      - name: Inspect npm package
        run: npm run verify:package

      - name: Verify exact release tag
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          EXPECTED_TAG="v${VERSION}"
          [[ "$TARGET_TAG" == "$EXPECTED_TAG" ]] || {
            echo "Expected exact tag $EXPECTED_TAG, received $TARGET_TAG" >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/$TARGET_TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || {
            echo "Checked-out commit is not the commit for $TARGET_TAG" >&2
            exit 1
          }

      - name: Check npm package availability
        id: availability
        env:
          RECOVERY: ${{ steps.target.outputs.recovery }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          PACKAGE_NAME="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.name)')"
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "$PACKAGE_NAME@$VERSION" version --json > /dev/null 2> "$error_file"; then
            if [[ "$RECOVERY" == "true" ]]; then
              echo "$PACKAGE_NAME@$VERSION is already published; recovery has nothing to do."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$PACKAGE_NAME@$VERSION is already published; refusing duplicate normal publish." >&2
            exit 1
          fi
          if ! grep -q 'E404' "$error_file"; then
            cat "$error_file" >&2
            echo "Could not determine whether $PACKAGE_NAME@$VERSION exists." >&2
            exit 1
          fi
          echo "$PACKAGE_NAME@$VERSION is absent from npm."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: ${{ steps.availability.outputs.should_publish == 'true' }}
        run: npm publish --access public --provenance
