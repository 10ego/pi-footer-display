name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing non-draft GitHub release tag to recover (for example v1.2.3)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or GitHub release
    if: ${{ vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) }}
    environment: release-automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create nerv-ops installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NERV_OPS_APP_ID }}
          private-key: ${{ secrets.NERV_OPS_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable squash auto-merge for release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].number' <<< "$RELEASE_PRS" | while read -r number; do
            merge_method="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // "NONE"')"
            echo "Release PR #$number auto-merge method: $merge_method"

            case "$merge_method" in
              SQUASH)
                echo "Squash auto-merge is already enabled for release PR #$number"
                continue
                ;;
              MERGE|REBASE)
                echo "Replacing $merge_method auto-merge for release PR #$number"
                gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto
                ;;
              NONE)
                ;;
              *)
                echo "Unexpected auto-merge method for release PR #$number: $merge_method" >&2
                exit 1
                ;;
            esac

            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
          done

  prepare:
    name: Prepare npm package
    needs: release
    if: ${{ always() && vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && github.ref == 'refs/heads/main' && ((needs.release.result == 'success' && needs.release.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.availability.outputs.should_publish }}
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      dist_tag: ${{ steps.target.outputs.dist_tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      tarball_filename: ${{ steps.package.outputs.tarball_filename }}
      tarball_sha256: ${{ steps.package.outputs.tarball_sha256 }}
    steps:
      - name: Resolve release target
        id: target
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if [[ -n "$DISPATCH_TAG" ]]; then
            TARGET_TAG="$DISPATCH_TAG"
            RECOVERY=true
          else
            TARGET_TAG="$RELEASE_TAG"
            RECOVERY=false
            if [[ -z "$TARGET_TAG" ]]; then
              echo "Release Please did not emit a tag" >&2
              exit 1
            fi
          fi

          SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TARGET_TAG" =~ $SEMVER_PATTERN ]]; then
            echo "Release tag must be an exact v-prefixed semantic version: $TARGET_TAG" >&2
            exit 1
          fi
          VERSION="${TARGET_TAG#v}"

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi

          {
            echo "tag=$TARGET_TAG"
            echo "version=$VERSION"
            echo "recovery=$RECOVERY"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify recovery GitHub release
        if: ${{ steps.target.outputs.recovery == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          release="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
          [[ "$(jq -r '.tagName' <<< "$release")" == "$TARGET_TAG" ]] || {
            echo "Recovery release tag does not exactly match $TARGET_TAG" >&2
            exit 1
          }
          [[ "$(jq -r '.isDraft' <<< "$release")" == "false" ]] || {
            echo "Recovery release $TARGET_TAG is a draft" >&2
            exit 1
          }

      - name: Check out exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify bundled npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node <<'NODE'
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(process.env.NPM_VERSION ?? "");
          if (!match) {
            console.error(`Could not parse bundled npm version: ${process.env.NPM_VERSION ?? ""}`);
            process.exit(1);
          }
          const actual = match.slice(1).map(Number);
          const minimum = [11, 5, 1];
          const supported = actual.some((part, index) => part > minimum[index]
            && actual.slice(0, index).every((value, prior) => value === minimum[prior]))
            || actual.every((part, index) => part === minimum[index]);
          if (!supported) {
            console.error(`Bundled npm ${actual.join(".")} is below required 11.5.1`);
            process.exit(1);
          }
          console.log(`Verified bundled npm ${actual.join(".")} supports trusted publishing.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release version metadata
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: npm run verify:release-version -- --expected "$EXPECTED_VERSION"

      - name: Inspect npm package
        run: npm run verify:package

      - name: Verify exact release tag and main ancestry
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          EXPECTED_TAG="v${VERSION}"
          [[ "$TARGET_TAG" == "$EXPECTED_TAG" ]] || {
            echo "Expected exact tag $EXPECTED_TAG, received $TARGET_TAG" >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/$TARGET_TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || {
            echo "Checked-out commit is not the commit for $TARGET_TAG" >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tag $TARGET_TAG is not on main; refusing to publish an arbitrary commit" >&2
            exit 1
          }

      - name: Check npm package availability
        id: availability
        env:
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
          RECOVERY: ${{ steps.target.outputs.recovery }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          PACKAGE_NAME="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.name)')"
          output_file="$RUNNER_TEMP/npm-view-output.json"
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "$PACKAGE_NAME@$VERSION" version --json > "$output_file" 2> "$error_file"; then
            if ! node --input-type=module - "$output_file" "$VERSION" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload !== process.argv[3]) process.exit(1);
          NODE
            then
              cat "$output_file" >&2
              cat "$error_file" >&2
              echo "npm returned malformed version metadata for $PACKAGE_NAME@$VERSION." >&2
              exit 1
            fi
            if [[ "$RECOVERY" == "true" ]]; then
              echo "$PACKAGE_NAME@$VERSION is already published; recovery has nothing to do."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$PACKAGE_NAME@$VERSION is already published; refusing duplicate normal publish." >&2
            exit 1
          fi
          if ! node --input-type=module - "$output_file" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload?.error?.code !== "E404") process.exit(1);
          NODE
          then
            cat "$output_file" >&2
            cat "$error_file" >&2
            echo "Could not determine whether $PACKAGE_NAME@$VERSION exists." >&2
            exit 1
          fi
          echo "$PACKAGE_NAME@$VERSION is absent from npm."

          dist_tag_output="$RUNNER_TEMP/npm-dist-tag-output.json"
          dist_tag_error="$RUNNER_TEMP/npm-dist-tag-error.txt"
          if npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" --json > "$dist_tag_output" 2> "$dist_tag_error"; then
            if ! CURRENT_VERSION="$(node --input-type=module - "$dist_tag_output" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof payload !== "string" || payload.length === 0) process.exit(1);
          process.stdout.write(payload);
          NODE
          )"; then
              cat "$dist_tag_output" >&2
              cat "$dist_tag_error" >&2
              echo "npm returned a malformed $DIST_TAG dist-tag for $PACKAGE_NAME." >&2
              exit 1
            fi
          elif node --input-type=module - "$dist_tag_output" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload?.error?.code !== "E404") process.exit(1);
          NODE
          then
            CURRENT_VERSION=""
            echo "$PACKAGE_NAME is absent from npm; no current $DIST_TAG dist-tag exists."
          else
            cat "$dist_tag_output" >&2
            cat "$dist_tag_error" >&2
            echo "Could not determine the current $DIST_TAG dist-tag for $PACKAGE_NAME." >&2
            exit 1
          fi

          if [[ -n "$CURRENT_VERSION" ]]; then
            if ! comparison="$(node scripts/compare-semver.mjs "$VERSION" "$CURRENT_VERSION")"; then
              echo "Could not compare $VERSION with current $DIST_TAG version $CURRENT_VERSION." >&2
              exit 1
            fi
            case "$comparison" in
              1)
                echo "$VERSION is newer than current $DIST_TAG version $CURRENT_VERSION."
                ;;
              -1)
                echo "$VERSION is lower than current $DIST_TAG version $CURRENT_VERSION; refusing dist-tag regression." >&2
                exit 1
                ;;
              0)
                echo "$VERSION equals current $DIST_TAG version $CURRENT_VERSION after the exact-version absence check; refusing inconsistent npm state." >&2
                exit 1
                ;;
              *)
                echo "Unexpected semantic-version comparison result: $comparison" >&2
                exit 1
                ;;
            esac
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Build and validate release tarball
        if: ${{ steps.availability.outputs.should_publish == 'true' }}
        id: package
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: |
          output_dir="$(mktemp -d "$RUNNER_TEMP/npm-package.XXXXXX")"
          pack_json="$RUNNER_TEMP/npm-pack.json"
          npm pack --ignore-scripts --json --pack-destination "$output_dir" > "$pack_json"

          validation="$(node --input-type=module - "$pack_json" "$output_dir" "$EXPECTED_VERSION" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { assertPackageContents, assertPackageMetadata } from "./scripts/verify-package-contents.mjs";

          const [packJsonPath, outputDir, expectedVersion] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(packJsonPath, "utf8"));
          if (!Array.isArray(payload) || payload.length !== 1) {
            throw new Error(`Expected npm pack to build exactly one tarball; received ${Array.isArray(payload) ? payload.length : "non-array output"}`);
          }

          const packageData = payload[0];
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (packageJson.version !== expectedVersion || packageData.version !== expectedVersion) {
            throw new Error(`Packed version does not exactly match ${expectedVersion}`);
          }
          const paths = assertPackageContents(packageData.files);
          assertPackageMetadata(packageData, packageJson, paths.length);

          if (path.basename(packageData.filename) !== packageData.filename) {
            throw new Error(`Unsafe tarball filename: ${packageData.filename}`);
          }
          const entries = fs.readdirSync(outputDir, { withFileTypes: true });
          if (entries.length !== 1 || !entries[0].isFile() || entries[0].name !== packageData.filename) {
            throw new Error("Isolated package output must contain only the expected tarball");
          }
          const tarballPath = path.join(outputDir, packageData.filename);
          const stat = fs.lstatSync(tarballPath);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1) {
            throw new Error("Packed tarball must be one non-empty regular file");
          }
          if (path.dirname(fs.realpathSync(tarballPath)) !== fs.realpathSync(outputDir)) {
            throw new Error("Packed tarball escaped the isolated output directory");
          }

          process.stdout.write(JSON.stringify({
            filename: packageData.filename,
            name: packageData.name,
            tarballPath,
          }));
          NODE
          )"

          package_name="$(jq -er '.name' <<< "$validation")"
          tarball_filename="$(jq -er '.filename' <<< "$validation")"
          tarball_path="$(jq -er '.tarballPath' <<< "$validation")"
          [[ "$package_name" == "pi-footer-display" ]] || {
            echo "Unexpected npm package name: $package_name" >&2
            exit 1
          }
          [[ "$tarball_filename" == "$package_name-$EXPECTED_VERSION.tgz" ]] || {
            echo "Unexpected npm tarball filename: $tarball_filename" >&2
            exit 1
          }
          [[ -f "$tarball_path" && ! -L "$tarball_path" ]] || {
            echo "Expected one regular tarball at $tarball_path" >&2
            exit 1
          }

          tarball_sha256="$(sha256sum "$tarball_path" | awk '{print $1}')"
          [[ "$tarball_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Could not compute the tarball SHA-256" >&2
            exit 1
          }
          artifact_name="npm-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_VERSION}"

          {
            echo "artifact_name=$artifact_name"
            echo "tarball_filename=$tarball_filename"
            echo "tarball_path=$tarball_path"
            echo "tarball_sha256=$tarball_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        if: ${{ steps.availability.outputs.should_publish == 'true' }}
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.tarball_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Validate uploaded artifact outputs
        if: ${{ steps.availability.outputs.should_publish == 'true' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "upload-artifact did not return a valid artifact ID" >&2
            exit 1
          }
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "upload-artifact did not return a valid SHA-256 artifact digest" >&2
            exit 1
          }

  publish:
    name: Publish verified tarball to npm
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.should_publish == 'true' && vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && github.ref == 'refs/heads/main' }}
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          registry-url: https://registry.npmjs.org

      - name: Verify bundled npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node <<'NODE'
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(process.env.NPM_VERSION ?? "");
          if (!match) {
            console.error(`Could not parse bundled npm version: ${process.env.NPM_VERSION ?? ""}`);
            process.exit(1);
          }
          const actual = match.slice(1).map(Number);
          const minimum = [11, 5, 1];
          const supported = actual.some((part, index) => part > minimum[index]
            && actual.slice(0, index).every((value, prior) => value === minimum[prior]))
            || actual.every((part, index) => part === minimum[index]);
          if (!supported) {
            console.error(`Bundled npm ${actual.join(".")} is below required 11.5.1`);
            process.exit(1);
          }
          console.log(`Verified bundled npm ${actual.join(".")} supports trusted publishing.`);
          NODE

      - name: Validate prepared package metadata
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.prepare.outputs.tarball_sha256 }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_TARBALL_FILENAME: ${{ needs.prepare.outputs.tarball_filename }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$EXPECTED_VERSION" =~ $SEMVER_PATTERN ]] || {
            echo "Prepared version is not an exact semantic version: $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ "$EXPECTED_TAG" == "v$EXPECTED_VERSION" ]] || {
            echo "Prepared tag does not exactly match version $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ "$EXPECTED_TARBALL_FILENAME" == "pi-footer-display-$EXPECTED_VERSION.tgz" ]] || {
            echo "Unexpected prepared tarball filename: $EXPECTED_TARBALL_FILENAME" >&2
            exit 1
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Prepared artifact ID is invalid" >&2
            exit 1
          }
          [[ "$ARTIFACT_NAME" =~ ^npm-package-[0-9]+-[0-9]+-[0-9A-Za-z.+-]+$ ]] || {
            echo "Unexpected prepared artifact name: $ARTIFACT_NAME" >&2
            exit 1
          }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Prepared tarball SHA-256 is invalid" >&2
            exit 1
          }
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Prepared server artifact digest is invalid" >&2
            exit 1
          }

          case "$DIST_TAG" in
            latest)
              [[ "$EXPECTED_VERSION" != *-* ]] || {
                echo "Prerelease version cannot use the latest dist-tag" >&2
                exit 1
              }
              ;;
            next)
              [[ "$EXPECTED_VERSION" == *-* ]] || {
                echo "Stable version cannot use the next dist-tag" >&2
                exit 1
              }
              ;;
            *)
              echo "Unexpected npm dist-tag: $DIST_TAG" >&2
              exit 1
              ;;
          esac

      - name: Verify GitHub Actions artifact metadata
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata_file="$RUNNER_TEMP/artifact-metadata.json"
          gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$metadata_file"

          metadata_id="$(jq -er 'if (.id | type) == "number" then (.id | tostring) else error("invalid artifact id") end' "$metadata_file")"
          metadata_name="$(jq -er 'if (.name | type) == "string" then .name else error("invalid artifact name") end' "$metadata_file")"
          metadata_expired="$(jq -er 'if (.expired | type) == "boolean" then (.expired | tostring) else error("invalid artifact expiration status") end' "$metadata_file")"
          metadata_digest="$(jq -er 'if (.digest | type) == "string" then .digest else error("invalid artifact digest") end' "$metadata_file")"
          workflow_run_id="$(jq -er '
            if (.workflow_run? == null) or (.workflow_run.id? == null) then
              ""
            elif (.workflow_run.id | type) == "number" then
              (.workflow_run.id | tostring)
            else
              error("invalid artifact workflow run id")
            end
          ' "$metadata_file")"

          [[ "$metadata_id" == "$ARTIFACT_ID" ]] || {
            echo "Artifact metadata ID does not match $ARTIFACT_ID" >&2
            exit 1
          }
          [[ "$metadata_name" == "$ARTIFACT_NAME" ]] || {
            echo "Artifact metadata name does not match $ARTIFACT_NAME" >&2
            exit 1
          }
          [[ "$metadata_expired" == "false" ]] || {
            echo "Artifact $ARTIFACT_ID is expired" >&2
            exit 1
          }
          [[ "$metadata_digest" == "sha256:$EXPECTED_ARTIFACT_DIGEST" ]] || {
            echo "Artifact metadata digest does not match the upload digest" >&2
            exit 1
          }
          if [[ -n "$workflow_run_id" && "$workflow_run_id" != "$GITHUB_RUN_ID" ]]; then
            echo "Artifact $ARTIFACT_ID belongs to workflow run $workflow_run_id, not $GITHUB_RUN_ID" >&2
            exit 1
          fi

      - name: Download exact release tarball artifact
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-package-download
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify downloaded release tarball
        id: verify
        env:
          ACTION_DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          DOWNLOAD_DIR: ${{ runner.temp }}/npm-package-download
          EXPECTED_PACKAGE_NAME: pi-footer-display
          EXPECTED_SHA256: ${{ needs.prepare.outputs.tarball_sha256 }}
          EXPECTED_TARBALL_FILENAME: ${{ needs.prepare.outputs.tarball_filename }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [[ -d "$DOWNLOAD_DIR" ]] || {
            echo "Artifact download directory does not exist" >&2
            exit 1
          }
          [[ "$(realpath "$ACTION_DOWNLOAD_PATH")" == "$(realpath "$DOWNLOAD_DIR")" ]] || {
            echo "download-artifact returned an unexpected download path" >&2
            exit 1
          }

          mapfile -d '' entries < <(find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 -print0)
          (( ${#entries[@]} == 1 )) || {
            echo "Expected exactly one downloaded artifact file; found ${#entries[@]} entries" >&2
            exit 1
          }
          tarball_path="${entries[0]}"
          [[ -f "$tarball_path" && ! -L "$tarball_path" ]] || {
            echo "Downloaded artifact entry is not one regular file" >&2
            exit 1
          }
          [[ "$(basename "$tarball_path")" == "$EXPECTED_TARBALL_FILENAME" ]] || {
            echo "Downloaded tarball filename does not match $EXPECTED_TARBALL_FILENAME" >&2
            exit 1
          }

          actual_sha256="$(sha256sum "$tarball_path" | awk '{print $1}')"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || {
            echo "Downloaded tarball SHA-256 does not match the prepared package" >&2
            exit 1
          }
          echo "Verified tarball SHA-256: $actual_sha256"

          python3 - "$tarball_path" "$EXPECTED_PACKAGE_NAME" "$EXPECTED_VERSION" <<'PYTHON'
          import json
          from pathlib import PurePosixPath
          import sys
          import tarfile

          tarball_path, expected_name, expected_version = sys.argv[1:]
          seen = set()
          package_json_member = None

          with tarfile.open(tarball_path, mode="r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Release tarball is empty")

              for member in members:
                  name = member.name
                  normalized = PurePosixPath(name)
                  parts = normalized.parts
                  if (
                      not name
                      or "\\" in name
                      or normalized.is_absolute()
                      or normalized.as_posix() != name
                      or len(parts) < 2
                      or parts[0] != "package"
                      or any(part in ("", ".", "..") for part in parts)
                  ):
                      raise SystemExit(f"Unsafe tar member path: {name!r}")
                  if name in seen:
                      raise SystemExit(f"Duplicate tar member path: {name!r}")
                  seen.add(name)
                  if member.issym() or member.islnk() or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"Unsupported tar member type: {name!r}")
                  if name == "package/package.json":
                      if not member.isfile() or package_json_member is not None:
                          raise SystemExit("Tarball must contain one regular package/package.json")
                      package_json_member = member

              if package_json_member is None:
                  raise SystemExit("Tarball does not contain package/package.json")
              if package_json_member.size > 1_000_000:
                  raise SystemExit("Tarball package.json is unexpectedly large")
              package_file = archive.extractfile(package_json_member)
              if package_file is None:
                  raise SystemExit("Could not read package/package.json")
              package_json = json.load(package_file)

          if package_json.get("name") != expected_name:
              raise SystemExit("Tarball package name does not match the prepared package")
          if package_json.get("version") != expected_version:
              raise SystemExit("Tarball package version does not match the prepared version")
          print(f"Verified {len(seen)} safe tar members and {expected_name}@{expected_version}.")
          PYTHON

          echo "tarball_path=$tarball_path" >> "$GITHUB_OUTPUT"

      - name: Publish exact tarball to npm
        env:
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          EXPECTED_SHA256: ${{ needs.prepare.outputs.tarball_sha256 }}
          TARBALL_PATH: ${{ steps.verify.outputs.tarball_path }}
        run: |
          case "$DIST_TAG" in
            latest|next) ;;
            *) echo "Unexpected npm dist-tag: $DIST_TAG" >&2; exit 1 ;;
          esac
          [[ -f "$TARBALL_PATH" && ! -L "$TARBALL_PATH" ]] || {
            echo "Verified tarball is no longer one regular file" >&2
            exit 1
          }
          [[ "$(sha256sum "$TARBALL_PATH" | awk '{print $1}')" == "$EXPECTED_SHA256" ]] || {
            echo "Verified tarball changed before publication" >&2
            exit 1
          }
          npm publish "$TARBALL_PATH" --access public --provenance --tag "$DIST_TAG" --ignore-scripts
